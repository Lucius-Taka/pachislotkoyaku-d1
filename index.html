<!DOCTYPE html>

        .box {
            background: white;

        }
        
        h3 {
            text-align: center;
            margin: 0 0 7px 0;
            color: #1c1c1e;
            font-size: 14px;
        }
        
        .reset-all-btn {
            position: absolute;
            top: 7px;
            right: 8px;
            width: 26px;
            height: 26px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: bold;
            color: #48484a;
            background: #fdf6f6;
            border: 1px solid #e5b8b7;
            border-radius: 50%;
            cursor: pointer;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
            line-height: 1;
            -webkit-tap-highlight-color: transparent;
        }
        .reset-all-btn:active {
            background: #f8e8e8;
            border-color: #d9534f;
            transform: scale(0.95);
        }

        .type-selector { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; margin-bottom: 8px; background: #e3e3e8; padding: 4px; border-radius: 8px; }

        .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
        label { font-size: 13px; color: #3a3a3c; font-weight: 600; width: 45%; }
        
        .input-area { width: 50%; }
        
        .input-group {
            display: flex;
            align-items: center;
            gap: 4px;
            width: 100%;
        }
        .input-group input {

            min-width: 0;
            height: 30px;
            padding: 5px 8px;

            border: 1px solid #c7c7cc;
            border-radius: 6px;
            box-sizing: border-box;
            text-align: right;
            -webkit-appearance: none;
        }
        
        .ctrl-btn {
            height: 30px;
            width: 32px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            color: #48484a;
            background: #f2f2f7;
            border: 1px solid #c7c7cc;
            border-radius: 6px;

            box-sizing: border-box;

            user-select: none;
            -webkit-user-select: none;

        }

            background: #34c759; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 14px; 
            font-weight: bold;

        }

            border-radius: 8px; 
            text-align: center; 
            font-size: 22px; 
            font-weight: bold; 
            color: #000;

            display: none;

    </style>
</head>

        </div>
    </div>
    <div class="row">
        <label>BIG回数</label>
        <div class="input-area">
            <div class="input-group">

                <input type="number" id="big" placeholder="0" oninput="saveState()">
                <button class="ctrl-btn" onclick="adjustCount('big', 1)" title="プラス">＋</button>
            </div>
        </div>
    </div>
    <div class="row">
        <label>REG回数</label>
        <div class="input-area">
            <div class="input-group">

            </div>

    </div>
    <div class="row">

        <div class="input-area">
            <div class="input-group">
                <input type="number" id="samai" placeholder="0" oninput="saveState()">

    </div>
    <button class="calc-btn" onclick="calc()">確率を計算する</button>

</div>

/* 各機種のパラメータ設定（ゴーゴー 1/6.10 ＆ ミスターのベルピエロ補正完全対応） */
const modelSpecs = {
    im:      { cherry: 36.48,  rep: 7.298, bigNet: 252 }, // アイム (1/5.98一致)
    funky:   { cherry: 36.65,  rep: 7.298, bigNet: 240 }, // ファンキー (1/5.83一致)
    my:      { cherry: 37.05,  rep: 7.298, bigNet: 240 }, // マイジャグ (1/5.79一致)

};

/* 個別クリア処理 */
function clearField(id) {
    const el = document.getElementById(id);
    if (el) {
        el.value = '';
        saveState();
    }
}

/* 全体リセット処理 */
function resetAll() {
    document.getElementById('g').value = '';
    document.getElementById('big').value = '';
    document.getElementById('reg').value = '';
    document.getElementById('samai').value = '';
    const resDiv = document.getElementById('res');
    if (resDiv) {
        resDiv.style.display = 'none';
        resDiv.innerText = '';
    }
    saveState();
}

function adjustCount(id, delta) {
    const el = document.getElementById(id);
    if (el) {
        let val = parseInt(el.value, 10) || 0;
        val += delta;
        if (val < 0) val = 0;
        el.value = val > 0 ? val : '';
        saveState();
    }
}

function updateTable(model) {
    const data = modelData[model];
    const table = document.getElementById('target_table');
    if (!table) return;
    let html = `<tr><th>設定</th><th>BIG</th><th>REG</th><th>合算</th><th>小役</th><th>機械割</th></tr>`;
    if(model === 'nkh' || model === 'npsp3' || model === 'np3') {
        for(let i = 0; i < 6; i++) {
            if(i === 4) continue;
            let n = (model === 'nkh' && i === 5) ? 'V' : (i + 1);
            html += `<tr><td>${n}</td><td>1/${data.b[i]}</td><td>1/${data.r[i]}</td><td>1/${data.g[i]}</td><td>1/${data.l[i]}</td><td>${data.w[i]}</td></tr>`;
        }
    } else {
        for(let i = 0; i < 6; i++) {
            html += `<tr><td>${i + 1}</td><td>1/${data.b[i]}</td><td>1/${data.r[i]}</td><td>1/${data.g[i]}</td><td>1/${data.l[i]}</td><td>${data.w[i]}</td></tr>`;
        }
    }
    table.innerHTML = html;
}

function selectModel(model) {
    currentModel = model;
    document.querySelectorAll('.type-btn').forEach(function(btn) { btn.classList.remove('active'); });
    const targetBtn = document.getElementById('btn_' + model);
    if (targetBtn) targetBtn.classList.add('active');
    const resDiv = document.getElementById('res');
    if (resDiv) resDiv.style.display = 'none';
    updateTable(model);
    saveState();
    const G = parseFloat(document.getElementById('g').value) || 0;
    if (G > 0) calc();
}

function calc() {
    const G = parseFloat(document.getElementById('g').value) || 0;
    const BIG = parseFloat(document.getElementById('big').value) || 0;
    const REG = parseFloat(document.getElementById('reg').value) || 0;
    const samai = parseFloat(document.getElementById('samai').value) || 0;
    const resDiv = document.getElementById('res');
    
    if (G <= 0) { return; }

    let grapeCount = 0;

    // ジャグラーシリーズ計算
    if (modelSpecs[currentModel] !== undefined) {
        const spec = modelSpecs[currentModel];
        const totalOut = G * 3 + samai;
        const bonusGain = (BIG * spec.bigNet) + (REG * 96);
        const repGain = (G / spec.rep) * 3;
        const cherryGain = (G / spec.cherry) * 2;
        
        let extraGain = 0;
        if (currentModel === 'mr') {
            // ミスタージャグラー専用：ベル・ピエロの獲得払い出し分の補正
            extraGain = G * 0.0968;
        }
        
        grapeCount = (totalOut - bonusGain - repGain - cherryGain - extraGain) / 8;
    } else {
        // パルサー・ハナハナ系など他機種
        let bNet = 240, rNet = 96, bellPay = 10;
        if (currentModel === 'npsp3') { bNet = 259; rNet = 104; bellPay = 10; }
        else if (currentModel === 'np3') { bNet = 259; rNet = 104; bellPay = 7; }
        else if (currentModel === 'hooh') { bNet = 240; rNet = 120; bellPay = 10; }
        else if (currentModel === 'kh') { bNet = 260; rNet = 120; bellPay = 9; }
        else if (currentModel === 'dh') { bNet = 252; rNet = 96;  bellPay = 9; }
        else if (currentModel === 'sh') { bNet = 240; rNet = 96;  bellPay = 8; }
        else if (currentModel === 'nkh') { bNet = 312; rNet = 130; bellPay = 8; }

        const totalOut = G * 3 + samai;
        const bonusGain = (BIG * bNet) + (REG * rNet);
        const repGain = (G / 7.3) * 3;
        
        grapeCount = (totalOut - bonusGain - repGain) / bellPay;
    }

    const probability = G / grapeCount;

    resDiv.style.display = 'block';
    if (probability > 0 && isFinite(probability)) {
        resDiv.innerHTML = '1 / ' + probability.toFixed(2);
    } else { 
        resDiv.innerText = '数値を正しく入力してください'; 
    }
    saveState();
}

function saveState() {
    const data = {
        g: document.getElementById('g').value,
        big: document.getElementById('big').value,
        reg: document.getElementById('reg').value,
        samai: document.getElementById('samai').value,
        model: currentModel
    };
    try {
        sessionStorage.setItem('slot_calc_state', JSON.stringify(data));
    } catch(e) {}
}

function restoreState() {
    updateTable(currentModel);
    const saved = sessionStorage.getItem('slot_calc_state');
    if (saved) {
        try {
            const data = JSON.parse(saved);
            if (document.getElementById('g')) document.getElementById('g').value = data.g || '';
            if (document.getElementById('big')) document.getElementById('big').value = data.big || '';
            if (document.getElementById('reg')) document.getElementById('reg').value = data.reg || '';
            if (document.getElementById('samai')) document.getElementById('samai').value = data.samai || '';
            if (data.model) selectModel(data.model);
            if (parseFloat(data.g) > 0) calc();
        } catch(e) {}
    }
}

document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'hidden') {
        saveState();
    }
});

window.addEventListener('DOMContentLoaded', restoreState);
window.addEventListener('pageshow', function(event) {
    if (event.persisted) {
        restoreState();
    }
});

restoreState();
</script>
</body>
</html>
